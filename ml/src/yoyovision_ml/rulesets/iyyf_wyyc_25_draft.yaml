# =============================================================================
# YoYoVision ruleset: iyyf-wyyc-25-draft
#
# IYYF/WYYC 2025-INSPIRED UNOFFICIAL DRAFT. This configuration mirrors the
# publicly known 1A freestyle structure (60% technical elements / 40% freestyle
# evaluation, eight FE categories, major deductions) for judge-assistance
# training. It is NOT sourced from, endorsed by, or certified by IYYF, WYYC, or
# any competition body, and it does not reproduce an official published trick
# value table. Organizations must review and adjust every value before relying
# on it beyond training use.
# =============================================================================

version: "iyyf-wyyc-25-draft"
is_official: false
disclaimer: >
  IYYF/WYYC 2025-inspired unofficial draft for training and judge-assistance
  only. Not certified by IYYF, WYYC, or any competition body. Deduction caps and
  band points are editable placeholders — verify against your event's published
  rules before competition use.

difficulty_band_points:
  basic: 1.0
  intermediate: 2.0
  advanced: 3.0
  unknown: 1.0

repeated_element_decay:
  occurrence_multipliers: [1.0, 0.65, 0.35, 0.15]
  high_risk_families:
    - suicide
    - whip_catch
    - horizontal

deduction_rules:
  - type: yoyo_stop
    points_per_occurrence: 1.0
    max_occurrences_penalized: 8
  - type: yoyo_change
    points_per_occurrence: 3.0
    max_occurrences_penalized: 3
  - type: yoyo_detach
    points_per_occurrence: 5.0
    max_occurrences_penalized: 2
  - type: dangerous_play_review
    points_per_occurrence: 5.0
    max_occurrences_penalized: null
    requires_manual_confirmation: true
  - type: other
    points_per_occurrence: 1.0
    max_occurrences_penalized: null

freestyle_evaluation_weights:
  execution: 1.0
  control: 1.0
  trick_diversity: 1.0
  space_use_emphasis: 1.0
  music_choreography: 1.0
  music_construction: 1.0
  body_control: 1.0
  showmanship: 1.0

technical_scale_max: 100.0
freestyle_evaluation_scale_max: 100.0
technical_weight: 0.6
freestyle_evaluation_weight: 0.4
low_confidence_review_threshold: 0.55
