[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoyovision-api"
version = "0.1.0"
description = "YoYoVision FastAPI service: persistence, auth, review, scoring, exports."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "yoyovision-ml",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "python-jose[cryptography]>=3.3",
  # passlib 1.7.4 is unmaintained and probes bcrypt internals (`__about__`)
  # that were removed in bcrypt>=4.1, so pin bcrypt below that line. See
  # docs/architecture.md "Known dependency constraints".
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-passlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yoyovision_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# NOTE: kept >= requires-python's minimum (3.11) at runtime; this only
# controls which typeshed/stub syntax mypy accepts. Pinned to 3.12 because
# numpy's bundled .pyi stubs (a transitive dependency via yoyovision-ml) now
# use PEP 695 `type X = ...` aliases unconditionally, which mypy cannot
# parse under python_version < 3.12.
python_version = "3.12"
strict = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
